<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#000000" />
    <title>PocketPad</title>
  </head>
  <body>
    <!--
      Host frame (PAGE-PLANS §2): 64px top bar, 48px safe margin, one left edge.
      Every id below is read by src/main.ts and must keep working:
      connection, room-panel, room-code, room-pin, room-hint, game-root, slots.
    -->
    <div id="app" class="host">
      <header class="top-bar">
        <span class="top-bar__wordmark">lanpad</span>
        <div class="top-bar__actions">
          <div
            id="connection"
            class="status-pill"
            role="status"
            aria-live="polite"
            data-state="pending"
          >
            Starting…
          </div>
          <button id="fullscreen-toggle" class="host-fullscreen" type="button">
            Full screen
          </button>
        </div>
      </header>

      <div class="host-body">
        <!--
          HP-01 Boot & room creation. Shown only while the room panel has no
          room (data-state="empty"). The failure copy swaps in when main.ts
          marks the connection bad; Try again submits the page URL, which is
          exactly the host's room-creation retry path.
        -->
        <section id="boot" class="boot" aria-labelledby="boot-title">
          <div class="boot__progress">
            <span class="boot__dot" aria-hidden="true"></span>
            <h1 id="boot-title" class="boot__title">Starting PocketPad</h1>
            <p class="boot__subtitle">Creating a room for this TV</p>
          </div>
          <div class="boot__failure" role="alert">
            <span class="boot__dot boot__dot--bad" aria-hidden="true"></span>
            <h1 class="boot__title">Could not create a room</h1>
            <p class="boot__subtitle">
              Check that the dev server is running, then try again.
            </p>
            <form class="boot__retry" method="get" action="">
              <button type="submit" class="action action--primary">
                Try again
              </button>
            </form>
          </div>
        </section>

        <section class="room" aria-label="Room">
          <!--
            Compatibility aliases for main.ts. The lobby hero in #room-panel is
            the only place the code and PIN are rendered (HP-02); these two stay
            in the DOM so the current host flow keeps updating them until W2
            moves the host flow to the new components.
          -->
          <div
            id="room-code"
            class="visually-hidden"
            aria-label="Room code"
            aria-hidden="true"
          >
            ----
          </div>
          <div
            id="room-pin"
            class="visually-hidden"
            aria-label="Room PIN"
            aria-hidden="true"
          >
            PIN ----
          </div>
          <div id="room-panel" class="room-panel" data-state="empty"></div>
          <p id="room-hint" class="room__hint" role="status" aria-live="polite">
            Creating a room…
          </p>
        </section>

        <!-- D3 mounts the renderer and start screen here; W2 adds launcher/stage. -->
        <main id="game-root" class="game-root"></main>

        <!-- HP-08 mounts SlotRoster into #slots; the raw input table is debug-only. -->
        <section class="roster" aria-label="Players">
          <h2 class="roster__title">Players</h2>
          <div id="slots" class="roster__mount"></div>
        </section>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
