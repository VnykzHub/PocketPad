<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PocketPad bake-off — custom engine</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #dfe8f2;
        --muted: #8aa0b6;
        --panel: rgba(9, 14, 21, 0.78);
        --accent: #5fb4ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; }
      body { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 2;
        min-width: 270px; padding: 10px 12px; border-radius: 8px;
        background: var(--panel); border: 1px solid rgba(120, 160, 200, 0.22);
        backdrop-filter: blur(6px); pointer-events: none;
      }
      #hud h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
      #hud .row { display: flex; justify-content: space-between; gap: 18px; color: var(--muted); }
      #hud .row b { color: var(--ink); font-weight: 500; }
      #hud .status { margin-top: 6px; color: var(--accent); white-space: pre-line; }
      #hud .err { color: #ff8a80; white-space: pre-line; }
      #boot {
        position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
        background: #0b0f14; color: var(--muted); transition: opacity 180ms ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .box { text-align: center; }
      #boot .title { color: var(--ink); font-size: 15px; letter-spacing: 0.04em; }
      #boot .detail { margin-top: 8px; max-width: 70ch; white-space: pre-line; }
    </style>
    <script>
      // The runner waits on ready + the boot marker. Keep this shape exact.
      window.__BAKEOFF_BOOTED__ = false;
      window.__BAKEOFF__ = {
        ready: false,
        backend: "unknown",
        frameTimesMs: [],
        drawCalls: 0,
        triangles: 0,
        instances: 0,
        firstFrameMs: 0,
        activations: 0,
        deactivations: 0,
        errors: []
      };
      window.__BAKEOFF_STATUS__ = { phase: "booting", detail: "page loaded" };
    </script>
  </head>
  <body>
    <div id="stage" aria-label="Bake-off render surface"></div>
    <div id="boot"><div class="box">
      <div class="title">POCKETPAD · CUSTOM ENGINE</div>
      <div class="detail" id="boot-detail">Starting…</div>
    </div></div>
    <div id="hud">
      <h1>PocketPad custom engine — bake-off</h1>
      <div class="row"><span>backend</span><b id="hud-backend">unknown</b></div>
      <div class="row"><span>fps</span><b id="hud-fps">—</b></div>
      <div class="row"><span>draws / tris</span><b id="hud-draws">—</b></div>
      <div class="row"><span>active objects</span><b id="hud-active">—</b></div>
      <div class="row"><span>measurement</span><b id="hud-measure">starting</b></div>
      <div class="status" id="hud-status"></div>
      <div class="err" id="hud-errors"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
