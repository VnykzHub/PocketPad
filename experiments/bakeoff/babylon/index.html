<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>PocketPad bake-off · Babylon.js</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }

        border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 6px;

      }
      #hud b { color: #9ad4ff; font-weight: 600; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud"><b>Babylon.js 9.32.0</b> · <span id="status">boot…</span></div>
